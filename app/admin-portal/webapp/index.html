<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Admin Portal</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <!-- Global error handler -->
    <script>
        console.log("=== ADMIN PORTAL LOADING ===");
        console.log("Script execution started at:", new Date().toISOString());
        
        window.addEventListener('error', function(event) {
            console.error("GLOBAL ERROR:", event.message);
            console.error("File:", event.filename);
            console.error("Line:", event.lineno);
            console.error("Column:", event.colno);
            console.error("Stack:", event.error?.stack);
        });
        
        window.addEventListener('unhandledrejection', function(event) {
            console.error("UNHANDLED PROMISE REJECTION:", event.reason);
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.153.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "asset.lifecycle.portal.adminportal": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
        onload="console.log('=== SAP UI5 BOOTSTRAP COMPLETE ===')">
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="asset.lifecycle.portal.adminportal"
        data-id="container"
        data-settings='{"id" : "asset.lifecycle.portal.adminportal"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
